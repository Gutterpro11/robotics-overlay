<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Standings Overlay</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="config.js"></script>
  <script src="assets/overlay.js"></script>
</head>
<body>
  <div class="canvas">
  
<div class="panel standings" style="top:90px; right:90px; width:780px; padding:26px 30px;">
  <div class="kicker">Leaderboard</div>
  <div class="table-title" style="font-size:42px;">Top 8 Standings</div>
  <table>
    <thead>
      <tr><th>#</th><th>Team</th><th>Wins</th><th>Losses</th><th>Diff</th></tr>
    </thead>
    <tbody id="standingsBody"></tbody>
  </table>
</div>
<div class="panel top-left" style="width:740px;">
  <div class="kicker">Event</div>
  <div class="big-title" id="eventTitle">Tournament Overlay</div>
  <div class="subtle" id="venueValue"></div>
</div>

  </div>
</body>
</html>
